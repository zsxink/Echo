[package]
name = "echo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Echo desktop adaptation layer: Tauri IPC, player adapter, platform integration and runtime orchestration."
repository.workspace = true

[dependencies]
echo-core = { path = "../echo-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Local dates and the local-timezone log timer (issue #38). `time` cannot read
# the local offset in multi-threaded Unix processes, so `chrono` is the only
# already-locked-in crate that serves all three desktop platforms.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Dynamic loading of the vendored libmpv (macOS dylib in the app bundle). The
# echo-desktop shell owns this platform bridge; echo-core never sees it.
libloading = { workspace = true }
trash = { workspace = true }
zeroize = "1.8"
fs2 = "=0.4.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-permissions = "=0.2.4"
tempfile = "3"

[dev-dependencies]
echo-core = { path = "../echo-core", features = ["testkit"] }
tempfile = "3"

[[bin]]
name = "echo-generate-ipc"
path = "src/bin/generate_ipc.rs"

# Inherit the workspace's complete lint policy. The only necessary `unsafe`
# allowance is declared, documented, and limited in the two libmpv modules.
[lints]
workspace = true
