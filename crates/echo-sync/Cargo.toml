[package]
name = "echo-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Echo local network library synchronization adapters."
repository.workspace = true

[features]
default = []
client = ["dep:reqwest", "dep:tokio", "dep:rustls"]
server = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tokio", "dep:rustls", "dep:tokio-rustls"]
discovery = ["dep:mdns-sd"]

[dependencies]
echo-core = { path = "../echo-core" }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
