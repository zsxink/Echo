[workspace]
resolver = "2"
members = [
    "crates/echo-core",
    "crates/echo-desktop",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.81"
# Echo is licensed under a custom source-available license based on Business
# Source License 1.1 (personal study/research use, no commercial use, no
# redistribution — see LICENSE). Cargo's `license` field accepts the SPDX
# identifier for the underlying BSL-1.1 structure.
#
# `publish = false` marks every workspace member as private (never published
# to crates.io). Combined with `[licenses.private] ignore = true` in
# deny.toml, this keeps Echo's own BUSL-1.1 license out of the permissive
# allow-list that governs third-party dependencies: cargo-deny exempts
# unpublished workspace crates from the allow-list check.
license = "BUSL-1.1"
publish = false
repository = "https://github.com/zsxink/Echo"

[workspace.dependencies]
# echo-core must never depend on Tauri, mpv, or any platform/UI crate.
# Dependencies here are shared across crates; keep platform-specific crates out of echo-core.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Unicode name normalization (NFKC) and user-perceived character length
# (grapheme clusters) — both are pure-Rust, cross-platform, no `unsafe`.
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-casefold = "0.2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }

# Phase 4 media pipeline: probing, tags/covers/lyrics parsing, file watching
# and thumbnail scaling. All pure-Rust, cross-platform crates with no `unsafe`
# in their public APIs. Symphonia (MPL-2.0) probes containers/audio tracks;
# lofty reads tags and embedded art/lyrics; notify watches library roots;
# image scales cover art into the two size-capped thumbnails.
lofty = "0.22"
symphonia = { version = "0.5", default-features = false, features = [
    "flac",
    "isomp4",
    "mpa",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Dynamic loading of the vendored platform libmpv from the desktop shell. Only
# echo-desktop uses it; libmpv/FFI never reach echo-core.
libloading = "0.7"
# OS recycle-bin/trash integration belongs to the desktop adapter only.
trash = "5.2"

# Property tests for domain name rules and state-machine transitions (dev-only).
proptest = "1"

[workspace.lints.rust]
# `deny` keeps unsafe disallowed throughout the workspace while permitting the
# documented, smallest-possible FFI modules to opt out locally. `forbid` would
# make that safety isolation mechanically impossible.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
