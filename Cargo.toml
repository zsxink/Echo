[workspace]
resolver = "2"
members = [
    "crates/echo-core",
    "crates/echo-desktop",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
repository = "https://github.com/echo-player/echo"

[workspace.dependencies]
# echo-core must never depend on Tauri, mpv, or any platform/UI crate.
# Dependencies here are shared across crates; keep platform-specific crates out of echo-core.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
