[package]
name = "echo-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Echo desktop application binary (extremely thin Tauri shell)."

# This binary stays thin: it only hosts the Tauri lifecycle and passes desktop
# concerns to `echo-desktop`. Core never sees Tauri or libmpv types.

[[bin]]
name = "Echo"
path = "src/main.rs"

[dependencies]
echo-desktop = { path = "../../../crates/echo-desktop" }
echo-core = { path = "../../../crates/echo-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The status-item panel is an AppKit boundary. Keeping the bindings target
# scoped prevents Cocoa from leaking into the portable desktop/Core layers.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibilityProtocols", "NSButton", "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSValue", "NSObject", "NSString"] }
block2 = "0.6.1"

[dev-dependencies]
# TempDir for `dialogs` multi-file import unit tests; resolves only for tests.
tempfile = { version = "3" }
# Tauri's deterministic mock runtime proves the existing main-window lifecycle
# without creating a real WebView during unit tests.
tauri = { version = "2.11.5", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints]
workspace = true
