name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: xcode-27
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored Windows libmpv-2.dll is a Git-LFS object (114 MB >
          # GitHub's 100 MB blob limit); the rust job needs the real file so
          # build.rs can stage it for Windows dev runs.
          lfs: true

      # The filesystem gate tests create real symlinks (walker / staging never
      # follow an escaping or externally-owned link). Windows runners only allow
      # `mklink` with Developer Mode enabled; flip the registry switch so the
      # tests exercise the real code rather than skipping.
      - name: Enable Windows Developer Mode for symlinks
        if: runner.os == 'Windows'
        run: |
          reg add "HKLM\Software\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --all -- --check

      # `cargo clippy`/`cargo test --workspace` compile the echo-app Tauri
      # shell, whose `generate_context!` macro requires the built frontend at
      # apps/desktop/dist (frontendDist). Build it here so the Rust job is not
      # coupled to the frontend job's output.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  frontend:
    name: Frontend (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: xcode-27
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm --filter @echo/desktop format:check

      - name: Lint
        run: pnpm --filter @echo/desktop lint

      - name: Typecheck
        run: pnpm --filter @echo/desktop typecheck

      - name: Test
        run: pnpm --filter @echo/desktop test -- --run

      - name: Build
        run: pnpm --filter @echo/desktop build

  macos-platform-gate:
    name: macOS platform Gate
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # task-1.9 runs `tauri build --bundles app`, whose generate_context!
      # macro requires the built frontend at apps/desktop/dist.
      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      # 9.7 additionally asserts the macOS bundle carries no foreign-platform
      # playback binaries and that the Windows DLL mappings stay in the
      # platform-specific config. It reads the bundle 1.9 leaves behind, so it
      # must run in the same job, after 1.9.
      - name: Build and verify macOS platform Gate
        run: pnpm verify:task -- 1.9 1.10 9.7

      - name: Upload libmpv Gate report
        uses: actions/upload-artifact@v4
        with:
          name: macos-libmpv-gate-report
          path: target/aarch64-apple-darwin/release/bundle/macos/echo-libmpv-report.md
          if-no-files-found: error

  windows-platform-gate:
    name: Windows platform Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Vendored libmpv-2.dll is Git-LFS; 9.7 checks its SHA-256 and 9.8
          # loads it for real, so the actual (smudged) file is required.
          lfs: true

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exercise candidate-library confirmation on Windows too; without this
      # explicit filter the native unit tests can be overlooked as macOS-only.
      - name: Run native libmpv confirmation regression tests
        run: "cargo test -p echo-desktop --lib native_confirmation_tests::"

      # task-9.8 builds and runs the libmpv_platform probe against the vendored
      # libmpv-2.dll (build.rs stages it to target/debug); no frontend or
      # webview runtime is needed for echo-desktop. 17.1 is the static
      # Windows-installer contract gate (issue #64) — config-only, but kept
      # in this job so it runs on every Windows-platform touchpoint.
      - name: Verify platform Gate (9.7 9.8 17.1)
        run: pnpm verify:task -- 9.7 9.8 17.1

  linux-platform-gate:
    name: Linux platform Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # task-9.8 on Linux reports a loud *pending* until task 2.2's CI first
      # build lands vendor/libmpv/linux/ (then the probe stages libmpv.so and
      # drives it for real). It must never silently skip.
      - name: Verify platform Gate (9.7 9.8)
        run: pnpm verify:task -- 9.7 9.8

  governance:
    name: Governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # The governance gates run `cargo test --workspace --all-targets
      # --all-features`, which builds the echo-app Tauri shell. Without these
      # the Linux build fails before any gate executes.
      - name: Install Linux webview dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      # The coverage gate shells out to `cargo llvm-cov`. The companion
      # `llvm-tools-preview` component is declared in rust-toolchain.toml and
      # re-asserted here so this step fails early and legibly if it ever drifts.
      # `taiki-e/install-action` would be faster, but `cargo install --locked`
      # keeps the supply chain to crates.io and matches local setup.
      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify active Rust toolchain
        run: node scripts/verify/check-toolchain.mjs

      # Two gates read `apps/desktop/dist`: the embedded-frontend freshness
      # check compares a binary against it, and the injection proof for that
      # check needs it to be able to express its violation at all. Building it
      # here is what keeps those from degrading into named skips.
      - name: Build the frontend bundle the desktop shell embeds
        run: pnpm --dir apps/desktop build

      - name: Run governance gates except mutation proofs
        run: pnpm verify:governance -- --without-injection


  injection-proofs:
    name: Gate injection proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux webview dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend bundle the desktop shell embeds
        run: pnpm --dir apps/desktop build

      - name: Build the shell binary checked by embedded-frontend proof
        run: cargo build -p echo-app

      - name: Prove each governance gate rejects its injected violation
        env:
          ECHO_INJECTION_REQUIRE_ALL: "1"
        run: node scripts/verify/injection-suite.mjs

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux webview dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      - name: Run release gate without external artifacts
        env:
          # Governance runs as a separate required job; avoid repeating its
          # normal Rust test suite in the scenario command set.
          ECHO_GOVERNANCE_GATE_IN_PARALLEL_JOB: "1"
        run: node scripts/verify/checks/task-13.9.mjs
