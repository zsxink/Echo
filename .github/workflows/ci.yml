name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: xcode-27
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored Windows libmpv-2.dll is a Git-LFS object (114 MB >
          # GitHub's 100 MB blob limit); only the Windows leg needs the real
          # file so build.rs can stage it. Linux/macOS never read it, so they
          # skip the LFS download.
          lfs: ${{ runner.os == 'Windows' }}

      # The filesystem gate tests create real symlinks (walker / staging never
      # follow an escaping or externally-owned link). Windows runners only allow
      # `mklink` with Developer Mode enabled; flip the registry switch so the
      # tests exercise the real code rather than skipping.
      - name: Enable Windows Developer Mode for symlinks
        if: runner.os == 'Windows'
        run: |
          reg add "HKLM\Software\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --all -- --check

      # `cargo clippy`/`cargo test --workspace` compile the echo-app Tauri
      # shell, whose `generate_context!` macro requires the built frontend at
      # apps/desktop/dist (frontendDist). Build it here so the Rust job is not
      # coupled to the frontend job's output.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # PR runs keep the full workspace test on Linux only; Windows/macOS still
      # run fmt, clippy and their platform Gates on every PR, and their full
      # workspace tests execute on main.
      - name: Test
        if: github.event_name != 'pull_request' || matrix.platform == 'Linux'
        run: cargo test --workspace --all-targets --all-features

      # These gates used to live in a separate Linux-only job. They share the
      # Linux leg's already-built workspace, so running them here removes a
      # cold job without dropping any check from PR or main.
      - name: Rust static gates
        if: matrix.platform == 'Linux'
        env:
          ECHO_PURITY_REQUIRE_BUILD: "1"
        run: pnpm verify:governance -- --sections=rust-static,purity

      - name: Task 16.1
        if: matrix.platform == 'Linux'
        run: pnpm verify:task -- 16.1

      - name: Task 9.7 9.8
        if: matrix.platform == 'Linux'
        run: pnpm verify:task -- 9.7 9.8

      # 8.12 (real libmpv smoke over the fixture matrix) and 13.2 (native
      # temp-library e2e + restart consistency) load the vendored macOS dylib
      # set that build.rs stages at target/Frameworks during the builds above.
      # They are macOS-only: the Linux vendor tree is not committed, and 8.12
      # fails rather than skipping when libmpv is unreachable. Both were
      # registered but wired into no CI job (issue #110 P1-6).
      - name: Verify libmpv smoke and native e2e gates
        if: runner.os == 'macOS'
        run: pnpm verify:task -- 8.12 13.2

  frontend:
    name: Frontend (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: xcode-27
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm --filter @echo/desktop format:check

      - name: Lint
        run: pnpm --filter @echo/desktop lint

      - name: Typecheck
        run: pnpm --filter @echo/desktop typecheck

      - name: Test
        run: pnpm --filter @echo/desktop test -- --run

      - name: Build
        run: pnpm --filter @echo/desktop build

  task-gates:
    name: Task gates (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            tasks: "1.1 1.3 1.8 3.1 4.1 5.1 6.1 11.5 12.5 13.3"
          - shard: desktop
            tasks: "7.1 8.1 8.2 8.3 8.4 8.5 8.6 8.7 8.8 8.9 8.10 8.11 10.6 11.1 11.2 11.4 16.2"
          - shard: frontend-a
            tasks: "10.1 10.2 10.3 10.4 10.5 11.3 11.6 13.1"
          - shard: frontend-b
            tasks: "10.7 10.8 10.9 10.10 12.1 12.2 12.3"
    steps:
      - uses: actions/checkout@v4

      # Only the two Rust shards need a toolchain and cargo cache; the frontend
      # shards run typecheck/vitest/node checks and never invoke cargo.
      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        if: matrix.shard == 'core' || matrix.shard == 'desktop'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        if: matrix.shard == 'core' || matrix.shard == 'desktop'
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every id below was registered in scripts/verify/manifest.json but wired
      # into no CI job and no scenario (issue #110 P1-6), so a red gate could
      # sit unnoticed for months. The list is the executable inventory of that
      # adjudication: an id runs here, in a platform Gate job, or is marked
      # `archived: true` in the manifest (and then skipped by `--all`).
      #
      # 16.1 runs in the Rust Linux job (it needs the built Tauri shell);
      # 8.12/13.2 run in the Rust job's macOS leg (staged dylibs); 1.7 runs in
      # the dependency-audit job (it installs cargo-deny/cargo-audit).
      - name: Verify task gates
        env:
          # task-13.1 drives headless Chromium over CDP; the GitHub ubuntu
          # image ships Google Chrome under /usr/bin, and its container-style
          # sandbox is unavailable.
          CHROME_PATH: /usr/bin/google-chrome
          CHROME_NO_SANDBOX: "1"
        run: pnpm verify:task -- ${{ matrix.tasks }}

      # task-12.5 asserts the PRD latency budgets and writes the measured
      # values here; the task requires them to be kept as a CI artifact.
      - name: Upload 50k benchmark result
        if: matrix.shard == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-50k
          path: apps/desktop/benchmark-50k.json
          if-no-files-found: error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      # task-1.7 installs missing tools itself, but naming the step keeps the
      # multi-minute compile out of the gate's own log and fails early/legibly.
      - name: Install audit tooling
        run: cargo install cargo-deny cargo-audit --locked

      # Was registered in the manifest but wired into no CI job (issue #110
      # P1-6). The offline-safe half (deny.toml licenses/bans/sources, the
      # advisory-ignore mirror and LICENSES.md) always gates; the online half
      # reports findings and only skips when the advisory DB is unreachable.
      - name: Verify dependency audit gate
        run: pnpm verify:task -- 1.7

  macos-platform-gate:
    name: macOS platform Gate
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # task-1.9 runs `tauri build --bundles app`, whose generate_context!
      # macro requires the built frontend at apps/desktop/dist.
      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      # 9.7 additionally asserts the macOS bundle carries no foreign-platform
      # playback binaries and that the Windows DLL mappings stay in the
      # platform-specific config. It reads the bundle 1.9 leaves behind, so it
      # must run in the same job, after 1.9.
      - name: Build and verify macOS platform Gate
        run: pnpm verify:task -- 1.9 1.10 9.7

      - name: Upload libmpv Gate report
        uses: actions/upload-artifact@v4
        with:
          name: macos-libmpv-gate-report
          path: target/aarch64-apple-darwin/release/bundle/macos/echo-libmpv-report.md
          if-no-files-found: error

  windows-platform-gate:
    name: Windows platform Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Vendored libmpv-2.dll is Git-LFS; 9.7 checks its SHA-256 and 9.8
          # loads it for real, so the actual (smudged) file is required.
          lfs: true

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exercise candidate-library confirmation on Windows too; without this
      # explicit filter the native unit tests can be overlooked as macOS-only.
      - name: Run native libmpv confirmation regression tests
        run: "cargo test -p echo-desktop --lib native_confirmation_tests::"

      # task-9.8 builds and runs the libmpv_platform probe against the vendored
      # libmpv-2.dll (build.rs stages it to target/debug); no frontend or
      # webview runtime is needed for echo-desktop. 17.1 is the static
      # Windows-installer contract gate (issue #64) and 18.1 the licensing &
      # privacy notices contract gate (issue #66) — both config-only, kept in
      # this job so they run on every Windows-platform touchpoint.
      - name: Verify platform Gate (9.7 9.8 17.1 18.1)
        run: pnpm verify:task -- 9.7 9.8 17.1 18.1

  governance:
    name: Governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # The governance gates run `cargo test --workspace --all-targets
      # --all-features`, which builds the echo-app Tauri shell. Without these
      # the Linux build fails before any gate executes.
      - name: Install Linux webview dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      # The fixture gate regenerates fixtures/audio in scratch directories and
      # compares them against the committed bytes; it needs ffmpeg on PATH.
      - name: Install ffmpeg for the fixture gate
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ffmpeg

      # The coverage gate shells out to `cargo llvm-cov`. The companion
      # `llvm-tools-preview` component is declared in rust-toolchain.toml and
      # re-asserted here so this step fails early and legibly if it ever drifts.
      # `taiki-e/install-action` would be faster, but `cargo install --locked`
      # keeps the supply chain to crates.io and matches local setup.
      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify active Rust toolchain
        run: node scripts/verify/check-toolchain.mjs

      # Two gates read `apps/desktop/dist`: the embedded-frontend freshness
      # check compares a binary against it, and the injection proof for that
      # check needs it to be able to express its violation at all. Building it
      # here is what keeps those from degrading into named skips.
      - name: Build the frontend bundle the desktop shell embeds
        run: pnpm --dir apps/desktop build

      - name: Run governance gates except mutation proofs
        run: pnpm verify:governance -- --without-injection


  injection-proofs:
    name: Gate injection proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux webview dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend bundle the desktop shell embeds
        run: pnpm --dir apps/desktop build

      - name: Build the shell binary checked by embedded-frontend proof
        run: cargo build -p echo-app

      - name: Prove each governance gate rejects its injected violation
        env:
          ECHO_INJECTION_REQUIRE_ALL: "1"
        run: node scripts/verify/injection-suite.mjs

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux webview dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      - name: Run release gate without external artifacts
        run: node scripts/verify/checks/task-13.9.mjs --delegated=governance
