name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      # The filesystem gate tests create real symlinks (walker / staging never
      # follow an escaping or externally-owned link). Windows runners only allow
      # `mklink` with Developer Mode enabled; flip the registry switch so the
      # tests exercise the real code rather than skipping.
      - name: Enable Windows Developer Mode for symlinks
        if: runner.os == 'Windows'
        run: |
          reg add "HKLM\Software\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --all -- --check

      # `cargo clippy`/`cargo test --workspace` compile the echo-app Tauri
      # shell, whose `generate_context!` macro requires the built frontend at
      # apps/desktop/dist (frontendDist). Build it here so the Rust job is not
      # coupled to the frontend job's output.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm --filter @echo/desktop format:check

      - name: Lint
        run: pnpm --filter @echo/desktop lint

      - name: Typecheck
        run: pnpm --filter @echo/desktop typecheck

      - name: Test
        run: pnpm --filter @echo/desktop test -- --run

      - name: Build
        run: pnpm --filter @echo/desktop build

  macos-platform-gate:
    name: macOS platform Gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # task-1.9 runs `tauri build --bundles app`, whose generate_context!
      # macro requires the built frontend at apps/desktop/dist.
      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      - name: Build and verify macOS platform Gate
        run: pnpm verify:task -- 1.9 1.10

      - name: Upload libmpv Gate report
        uses: actions/upload-artifact@v4
        with:
          name: macos-libmpv-gate-report
          path: target/aarch64-apple-darwin/release/bundle/macos/echo-libmpv-report.md
          if-no-files-found: error

  governance:
    name: Governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      # The governance gates run `cargo test --workspace --all-targets
      # --all-features`, which builds the echo-app Tauri shell. Without these
      # the Linux build fails before any gate executes.
      - name: Install Linux webview dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      # The coverage gate shells out to `cargo llvm-cov`. The companion
      # `llvm-tools-preview` component is declared in rust-toolchain.toml and
      # re-asserted here so this step fails early and legibly if it ever drifts.
      # `taiki-e/install-action` would be faster, but `cargo install --locked`
      # keeps the supply chain to crates.io and matches local setup.
      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify active Rust toolchain
        run: node scripts/verify/check-toolchain.mjs

      # Two gates read `apps/desktop/dist`: the embedded-frontend freshness
      # check compares a binary against it, and the injection proof for that
      # check needs it to be able to express its violation at all. Building it
      # here is what keeps those from degrading into named skips.
      - name: Build the frontend bundle the desktop shell embeds
        run: pnpm --dir apps/desktop build

      - name: Run governance gates
        run: pnpm verify:governance

      - name: Run release gate without external artifacts
        run: node scripts/verify/checks/task-13.9.mjs

      # OpenSpec is a pinned devDependency, not a globally installed tool, so
      # the CLI is only reachable through pnpm.
      - name: Validate archived OpenSpec changes
        run: pnpm exec openspec validate --archived
