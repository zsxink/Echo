name: CI

on:
  push:
    branches: [main]
    # Audited doc-only whitelist. Every entry is a documentation file that no
    # gate reads; task-1.5 pins the list (and requires push and pull_request to
    # carry the same one) so adding a gate input here fails.
    # Deliberately absent: README.md (tasks 17.1/18.1 read it),
    # openspec/changes/archive/** (the audio-effects gates read archived
    # evidence) and artifacts/** (check-native-attestation reads its logs).
    paths-ignore:
      - docs/PRODUCT.md
      - docs/DESIGN.md
      - docs/ROADMAP.md
      - docs/interface-terminology.md
      - docs/arch-standards-remaining.md
  pull_request:
    paths-ignore:
      - docs/PRODUCT.md
      - docs/DESIGN.md
      - docs/ROADMAP.md
      - docs/interface-terminology.md
      - docs/arch-standards-remaining.md

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.platform }} ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, os: ubuntu-latest, shard: workspace, cache: linux-workspace, packages: "--workspace" }
    steps:
      - uses: actions/checkout@v4

      - name: Isolate Linux Rustup home
        run: bash scripts/verify/isolate-linux-rustup-home.sh

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --all -- --check

      # `cargo clippy`/`cargo test --workspace` compile the echo-app Tauri
      # shell, whose `generate_context!` macro requires the built frontend at
      # apps/desktop/dist (frontendDist). Build it here so the Rust job is not
      # coupled to the frontend job's output.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      # `cargo test` is the last build-shaped cargo call on purpose: the saved
      # `linux-workspace` cache must match what its readers restore. Clippy
      # stays before it, and the static gates below run no cargo build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Linux carries the full workspace suite on PR and main. macOS/Windows
      # run the same suite in the main-only `rust-desktop` job; their platform
      # Gates still compile and test platform code on every PR.
      - name: Test
        run: cargo test ${{ matrix.packages }} --all-targets --all-features

      # These gates used to live in a separate Linux-only job. They share the
      # Linux leg's already-built workspace, so running them here removes a
      # cold job without dropping any check from PR or main. purity moved to
      # governance-static so the last cargo call here keeps the test shape.
      - name: Rust static gates
        run: pnpm verify:governance -- --sections=rust-static

  # The macOS/Windows `desktop` shards carry the rest of the workspace tests.
  # They must be absent on pull requests and fully present on main, which a
  # job-level `if` can express only because it no longer needs matrix.* (GitHub
  # evaluates a job-level `if` before the matrix expands, where `matrix` is not
  # an available context).
  rust-desktop:
    name: Rust desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macOS,   os: xcode-27,       shard: desktop, cache: macos-desktop,   packages: "--workspace" }
          - { platform: Windows, os: windows-latest, shard: desktop, cache: windows-desktop, packages: "--workspace" }
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored Windows libmpv-2.dll is a Git-LFS object (114 MB >
          # GitHub's 100 MB blob limit); only the Windows leg needs the real
          # file so build.rs can stage it. macOS never reads it, so it skips
          # the LFS download.
          lfs: ${{ runner.os == 'Windows' }}

      # The filesystem gate tests create real symlinks (walker / staging never
      # follow an escaping or externally-owned link). Windows runners only allow
      # `mklink` with Developer Mode enabled; flip the registry switch so the
      # tests exercise the real code rather than skipping.
      - name: Enable Windows Developer Mode for symlinks
        if: runner.os == 'Windows'
        run: |
          reg add "HKLM\Software\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The `rust` job is Linux-only now, so this main-only job is the sole
      # carrier of macOS/Windows fmt and clippy. Format check needs no
      # toolchain beyond rustfmt; Clippy must wait for the built frontend below
      # because it compiles the Tauri shell too.
      - name: Format check
        run: cargo fmt --all -- --check

      # `cargo test` compiles the echo-app Tauri shell, whose
      # `generate_context!` macro requires the built frontend at
      # apps/desktop/dist (frontendDist). Build it here so this job is not
      # coupled to the frontend job's output.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # This job only exists on main, so no step-level tiering is needed.
      # `cargo test` must remain the last cargo call: it fixes the shape of the
      # saved `macos-desktop` / `windows-desktop` cache the platform Gates read.
      - name: Test
        run: cargo test ${{ matrix.packages }} --all-targets --all-features

  frontend:
    name: Frontend (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One leg on purpose. The five checks below are jsdom + Node toolchain
        # work; none of the 57 frontend test files reads process.platform, so a
        # macOS or Windows leg re-ran identical work. Frontend *build* coverage
        # on those platforms stays with the Tauri-context builds in `rust` and
        # `rust-desktop`. The matrix and the platform-suffixed name are kept so
        # the check name still carries its platform (`Frontend (Linux)`).
        include:
          - platform: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm --filter @echo/desktop format:check

      - name: Lint
        run: pnpm --filter @echo/desktop lint

      - name: Typecheck
        run: pnpm --filter @echo/desktop typecheck

      # `--reporter=verbose` is what the scenario-evidence gate pins for the
      # `frontend-test` delegation: the delegated Vitest suite must be the same
      # command the scenarios name.
      - name: Test
        run: pnpm --filter @echo/desktop test -- --run --reporter=verbose

      - name: Build
        run: pnpm --filter @echo/desktop build

      # 13.1 drives the built bundle in headless Chromium over CDP. `--no-build`
      # skips its internal rebuild because the `Build` step immediately above
      # produced the same dist; a failed build still fails the E2E.
      - name: Task 13.1 (headless E2E)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CHROME_NO_SANDBOX: "1"
        run: node scripts/verify/checks/task-13.1.mjs --no-build

  task-gates:
    name: Task gates (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            tasks: "1.1 1.3 12.5 13.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Isolate Linux Rustup home
        run: bash scripts/verify/isolate-linux-rustup-home.sh

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
          save-if: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The executable inventory: every id below has no equivalent in the
      # workspace or frontend suites. The rest of the old 42-id list was a
      # subset of one of those suites and is marked `archived: true` in the
      # manifest (with the carrying gate named in its `archivedReason`), so
      # `run-task --all` skips them. Their scripts were removed by
      # trim-archived-gates-and-local-artifacts; naming one of those ids now
      # reports "no verification command registered". Task 13.2 is the
      # exception: its script is kept as an injection-governance guard target.
      #
      # 13.1 runs in the Frontend job (built bundle + Chrome); 16.1 runs in
      # governance-static (static-only); 8.12/13.2 in the macOS native Gate
      # (staged dylibs); 1.7 in governance-static (cargo-deny + cargo-audit).
      - name: Verify task gates
        run: pnpm verify:task -- ${{ matrix.tasks }}

      # task-12.5 asserts the PRD latency budgets and writes the measured
      # values here; the task requires them to be kept as a CI artifact.
      - name: Upload 50k benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-50k
          path: apps/desktop/benchmark-50k.json
          if-no-files-found: error

      # The three performance scenarios used to occupy their own job while
      # sharing this shard's toolchain and `linux-workspace` cache. They run
      # here instead: this job is a cache reader (`save-if: false`), so the
      # `--release` artifacts the scenarios compile never land in a key the
      # Rust shards restore. Placed after the benchmark upload so a perf
      # failure cannot cost task-12.5 its required artifact.
      - name: Classify performance scenario paths
        id: perf-paths
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ECHO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ECHO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify/ci-perf-paths.mjs
      - name: Run performance scenarios
        if: github.event_name != 'pull_request' || steps.perf-paths.outcome != 'success' || steps.perf-paths.outputs.skip != 'true'
        run: pnpm verify:perf

  macos-platform-gate:
    name: macOS platform Gate
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-desktop
          save-if: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # task-1.9 runs `tauri build --bundles app`, whose generate_context!
      # macro requires the built frontend at apps/desktop/dist.
      - name: Build frontend for Tauri context
        run: pnpm --dir apps/desktop build

      # 9.7 additionally asserts the macOS bundle carries no foreign-platform
      # playback binaries and that the Windows DLL mappings stay in the
      # platform-specific config. It reads the bundle 1.9 leaves behind, so it
      # must run in the same job, after 1.9.
      - name: Build and verify macOS platform Gate
        run: pnpm verify:task -- 1.9 1.10 9.7

      # This job just built the bundle and the dist it embeds, so the
      # embedded-frontend check has both inputs without a second build. It
      # moved here from the deleted injection-proofs job, which owned a shell
      # binary solely for this comparison.
      - name: Verify embedded frontend freshness
        run: node scripts/verify/checks/check-embedded-frontend.mjs --bin target/aarch64-apple-darwin/release/bundle/macos/Echo.app/Contents/MacOS/Echo

      - name: Upload libmpv Gate report
        uses: actions/upload-artifact@v4
        with:
          name: macos-libmpv-gate-report
          path: target/aarch64-apple-darwin/release/bundle/macos/echo-libmpv-report.md
          if-no-files-found: error

  macos-native-gate:
    name: macOS native Gate
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-desktop
          save-if: false

      # 8.12/13.2 load the vendored dylibs through DYLD_LIBRARY_PATH at
      # target/Frameworks, which apps/desktop/src-tauri/build.rs stages when the
      # shell is built. This job never builds the shell, so it stages the same
      # vendored set itself (build.rs selects by the `.dylib` extension, and the
      # vendor dir holds only regular files); 8.12 fails loudly if it is empty.
      - name: Stage vendored libmpv dylibs
        run: |
          mkdir -p target/Frameworks
          cp apps/desktop/src-tauri/vendor/libmpv/macos/*.dylib target/Frameworks/

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Verify libmpv smoke gate
        run: pnpm verify:task -- 8.12

  windows-platform-gate:
    name: Windows platform Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Vendored libmpv-2.dll is Git-LFS; 9.7 checks its SHA-256 and 9.8
          # loads it for real, so the actual (smudged) file is required.
          lfs: true

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-desktop
          save-if: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exercise candidate-library confirmation on Windows too; without this
      # explicit filter the native unit tests can be overlooked as macOS-only.
      - name: Run native libmpv confirmation regression tests
        run: "cargo test -p echo-desktop --lib native_confirmation_tests::"

      # task-9.8 builds and runs the libmpv_platform probe against the vendored
      # libmpv-2.dll (build.rs stages it to target/debug); no frontend or
      # webview runtime is needed for echo-desktop. 17.1 is the static
      # Windows-installer contract gate (issue #64) and 18.1 the licensing &
      # privacy notices contract gate (issue #66) — both config-only, kept in
      # this job so they run on every Windows-platform touchpoint.
      - name: Verify platform Gate (9.7 9.8 17.1 18.1)
        run: pnpm verify:task -- 9.7 9.8 17.1 18.1

  governance-static:
    name: Governance static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Isolate Linux Rustup home
        run: bash scripts/verify/isolate-linux-rustup-home.sh

      - name: Install Rust toolchain (pinned, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: governance-static
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The fixture gate regenerates fixtures/audio in scratch directories and
      # compares them against the committed bytes; it needs ffmpeg on PATH.
      - name: Install ffmpeg for the fixture gate
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ffmpeg

      # The coverage gate shells out to `cargo llvm-cov`. The companion
      # `llvm-tools-preview` component is declared in rust-toolchain.toml and
      # re-asserted here so this step fails early and legibly if it ever drifts.
      # `taiki-e/install-action` would be faster, but `cargo install --locked`
      # keeps the supply chain to crates.io and matches local setup.
      # Coverage is main-only: a PR does not pay the multi-minute
      # cargo-llvm-cov install, and the measured coverage still gates main.
      - name: Install coverage tooling
        if: github.event_name != 'pull_request'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # purity used to run at the end of the Rust Linux leg, which left a
      # default-feature `cargo check` as that job's last cargo call and broke
      # the cache-shape invariant. It needs only cargo and this job's target
      # dir, so it lives here, before coverage.
      - name: Run build purity gate
        env:
          ECHO_PURITY_REQUIRE_BUILD: "1"
        run: pnpm verify:governance -- --sections=purity

      # 16.1's static contract (single URL->path owner, no url.to_string(),
      # path-typed runtime boundary) has no other carrier; its compile and
      # behavior halves are covered by the workspace test.
      - name: Task 16.1 static contract
        run: pnpm verify:task -- 16.1

      # No webkit or frontend build: these sections do not compile the Tauri
      # shell or read apps/desktop/dist. The Rust-heavy sections live in the
      # Rust Linux leg, and the embedded-frontend check lives in the macOS
      # platform Gate, which owns the bundle it inspects.
      - name: Run governance static gates
        run: pnpm verify:governance -- --sections=registry,static

      # Main-only, matching the install step above. task-1.5 pins both the
      # command and the skip condition so coverage cannot vanish from main.
      - name: Run coverage gate
        if: github.event_name != 'pull_request'
        run: pnpm verify:governance -- --sections=coverage

      # task-1.7 installs missing tools itself, but naming the install step keeps
      # the multi-minute compile out of the gate's own log and fails early.
      # cargo-audit is only used by the online half, so PRs skip it entirely.
      - name: Install audit tooling
        run: |
          cargo install cargo-deny --locked
          if [ "$ECHO_AUDIT_OFFLINE_ONLY" != "1" ]; then cargo install cargo-audit --locked; fi
        env:
          ECHO_AUDIT_OFFLINE_ONLY: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      # The offline-safe half (deny.toml licenses/bans/sources, the
      # advisory-ignore mirror and LICENSES.md) always gates. The online half
      # runs on main and in the scheduled Dependency audit workflow; on PRs it
      # is skipped with an explicit note (a new advisory must not block every
      # in-flight PR).
      - name: Verify dependency audit gate
        env:
          ECHO_AUDIT_OFFLINE_ONLY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: pnpm verify:task -- 1.7

  # The injection proof suite (mutation-testing the governance gates) is a
  # local command: `node scripts/verify/injection-suite.mjs`. It proves the
  # gates' own failure behavior, not product behavior, and cost three full
  # runner instances per PR. The static proof registry stays enforced by
  # `check-scenario-command-proof.mjs` inside `pnpm verify:governance`.

  # The release gate is scenario reconciliation + PRD matrix + static
  # contract checks only. Every scenario command it would run is either a
  # subprocess subset of the Linux workspace suite / Frontend Vitest (delegated
  # via `delegatedTo`), or the 50k bench that task-12.5 already measures and
  # uploads from `task-gates`. Re-running them here spent ~560s per PR on a
  # second identical execution, so this job no longer needs a Rust toolchain,
  # the webview system packages, or the frontend build.
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate without external artifacts
        run: node scripts/verify/checks/task-13.9.mjs --skip-static --delegated=governance,perf,benchmark,workspace-test,frontend-test
